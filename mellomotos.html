<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mello Motos | Estoque Digital</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="banner-vendedor">
      <div class="container">
        <div class="vendedor-content">
          <div class="vendedor-info">
            <div class="vendedor-foto">
              <img src="img/Logo.jpg" alt="MELLO MOTOS OFICIAL" />
            </div>
            <div class="vendedor-texto">
              <h1>MELLO MOTOS OFICIAL</h1>
              <p>Conectando você à sua próxima moto com as melhores condições!</p>
            </div>
          </div>
          <div class="logo-marca">
            <img src="img/Logo.jpg" alt="Mello Motos Logo" />
          </div>
        </div>
      </div>
    </div>

    <div class="container">
      <div style="display: flex; justify-content: flex-end; gap: 12px; margin: -50px 0 30px;">
        <a href="https://wa.me/5554992354040" target="_blank" class="btn btn-whatsapp">
          💬 Fale comigo
        </a>
        <button class="btn btn-instagram">📱</button>
      </div>

      <div class="secao-titulo">
        <h2>Escolha sua moto</h2>
      </div>

      <div class="motos-grid" id="motosGrid"></div>
    </div>

    <div class="modal" id="modal">
      <div class="modal-content">
        <div class="modal-header">
          <img id="modalImagem" src="" alt="Moto" />
          <button class="modal-close" onclick="fecharModal()">×</button>
        </div>
        <div class="modal-body">
          <div class="modal-titulo" id="modalNome"></div>
          <div class="modal-tipo" id="modalTipo"></div>
          <div class="modal-specs" id="modalSpecs"></div>
          <div class="modal-descricao" id="modalDescricao"></div>
          <div class="modal-acoes">
            <button class="btn-whatsapp-modal" onclick="enviarWhatsApp()">
              💬 Falar com o vendedor pelo WhatsApp
            </button>
          </div>
        </div>
      </div>
    </div>

    <footer>
      <p><strong>© 2026 Mello Motos — Passo Fundo RS</strong></p>
      <p>✓ 4.000+ Motos Vendidas | ✓ As Melhores Ofertas da Região | ✓ Aprovação Rápida Até 48h</p>
      <p>Compre sua moto agora! WhatsApp: (54) 99235-4040</p>
    </footer>

    <!-- Carregar os dados das motos -->
    <script src="motos-dados.js"></script>
    <!-- Carregar o script de funcionalidades -->
    <script src="script.js"></script>
  </body>
</html>
